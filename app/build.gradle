plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.groupjoiner'
    compileSdk 34

    // Chave de debug estavel: no CI o workflow restaura a chave (segredo DEBUG_KEYSTORE_B64) e informa o caminho em
    // DEBUG_KEYSTORE_FILE. Sem a variavel (build local), nada muda: vale a chave de debug padrao do Android.
    signingConfigs {
        debug {
            def estavel = System.getenv('DEBUG_KEYSTORE_FILE')
            if (estavel) {
                storeFile file(estavel)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
                storeType 'pkcs12'
            }
        }
    }

    defaultConfig {
        applicationId "com.groupjoiner"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
