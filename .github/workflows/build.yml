name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Permissão ao gradlew
        run: chmod +x gradlew

      - name: Regenerar Gradle Wrapper
        run: |
          curl -L "https://services.gradle.org/distributions/gradle-8.2-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          /tmp/gradle/gradle-8.2/bin/gradle wrapper --gradle-version 8.2

      - name: Restaurar chave de assinatura estável
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            # Decodifica com Python: o base64 do runner novo (uutils) recusou a entrada; aqui se descarta BOM/nao-ASCII e o b64decode ignora quebras de linha e espacos
            python3 -c 'import base64,os; d=base64.b64decode(os.environ["DEBUG_KEYSTORE_B64"].encode("ascii","ignore")); open(os.path.expanduser("~/.android/debug.keystore"),"wb").write(d); print("Chave de assinatura estavel restaurada:", len(d), "bytes")'
            keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -E 'Alias name|SHA256'
            # Caminho explicito para o Gradle (nao depende do local padrao do AGP): o app/build.gradle le DEBUG_KEYSTORE_FILE
            cp ~/.android/debug.keystore "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Segredo DEBUG_KEYSTORE_B64 ausente: o build vai gerar uma chave de debug nova (o APK não atualiza por cima do anterior)."
          fi

      - name: Build APK debug
        run: ./gradlew assembleDebug

      - name: Mostrar assinatura do APK
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | grep -E 'Owner|SHA256'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupJoiner-APK
          path: app/build/outputs/apk/debug/app-debug.apk
